<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#240e42"><title>Finora • Financial Command Center</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><div id="toast" role="status"></div><section id="auth" class="auth"><div class="auth-card glass"><div class="logo">✦ Finora</div><h1>Your money. Your control.</h1><p>Private personal finance, beautifully organized.</p><form id="authForm"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="6" autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form><div class="auth-links"><button id="signup">Create account</button><button id="reset">Reset password</button></div><p class="hint">Configure Supabase in js/config.js to sign in. Or explore the separate demo.</p><button id="demo" class="secondary">Explore demo (sample data)</button></div></section><div id="shell" hidden><aside id="sidebar" class="glass"><div class="logo">✦ <span>Finora</span></div><nav id="nav"></nav><div class="side-bottom"><button id="collapse">☰ <span>Collapse</span></button><button id="theme">☾ <span>Theme</span></button><button id="logout">⇥ <span>Sign out</span></button></div></aside><main><header><div><small>PERSONAL FINANCE / <span id="crumb">OVERVIEW</span></small><h1 id="pageTitle">Financial Command Center</h1></div><div class="head-actions"><span id="syncBadge" class="pill">● Ready</span><select id="currency" aria-label="Currency"><option>PHP</option><option>USD</option><option>EUR</option><option>JPY</option><option>GBP</option></select><button id="bell" aria-label="Notifications">♧ <span id="bellCount"></span></button></div></header><section id="content"></section></main>
